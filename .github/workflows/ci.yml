name: Rust
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers xvfb
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo check -p zest --no-default-features --locked
      - run: cargo run -p zest-headless --locked
      - run: cargo run -p zest-text-demo --locked
      - run: cargo run -p zest-layout-demo --locked
      - run: cargo run -p zest-layout-text-demo --locked
      - run: cargo bench -p zest-core --bench reconciliation --locked -- --smoke
      - if: runner.os == 'Linux'
        name: Vulkan software smoke and pixel checks
        shell: bash
        run: |
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          VK_DRIVER_FILES="$icd" xvfb-run -a cargo run -p zest-quad --locked -- --smoke
          VK_DRIVER_FILES="$icd" xvfb-run -a cargo run -p zest-quad --locked -- --layout --smoke
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo test --workspace --all-features --locked
