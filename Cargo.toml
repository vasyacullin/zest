[workspace]
members = ["crates/zest-core", "crates/zest-paint", "crates/zest-gpu", "crates/zest-text", "crates/zest-layout", "demos/headless", "demos/quad", "demos/text", "demos/layout", "demos/layout-text"]
exclude = ["examples/gpui", "examples/egui", "examples/imgui", "examples/dear-imgui-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
bevy_ecs = { version = "=0.20.1", default-features = false, features = ["std"] }
zest-core = { path = "crates/zest-core" }
zest-gpu = { path = "crates/zest-gpu" }
zest-paint = { path = "crates/zest-paint" }
zest-text = { path = "crates/zest-text" }
zest-layout = { path = "crates/zest-layout" }
taffy = { version = "=0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
unicode-segmentation = "=1.13.3"
naga = { version = "=30.0.1", features = ["wgsl-in"] }
wgpu-types = "=30.0.1"
raw-window-handle = "=0.6.2"
winit = "=0.30.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "zest"
description = "A hybrid Rust GUI engine — early foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zest-core.workspace = true
zest-paint.workspace = true
zest-gpu = { workspace = true, optional = true }
zest-text = { workspace = true, optional = true }
zest-layout = { workspace = true, optional = true }

[features]
default = []
gpu = ["dep:zest-gpu"]
text = ["dep:zest-text"]
text-raster = ["text", "zest-text/raster"]
layout = ["dep:zest-layout"]
layout-text = ["layout", "text-raster", "zest-layout/text"]

[lints]
workspace = true
